version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cctv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cctv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cctvpass}
      POSTGRES_DB: ${POSTGRES_DB:-cctv_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cctv}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cctv_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
